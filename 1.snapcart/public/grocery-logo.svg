<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Amber Spark Gradient -->
    <linearGradient id="gAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Fresh Leaf Gradient -->
    <linearGradient id="gLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="cartShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#052e16" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="30" fill="url(#gBg)" filter="url(#cartShadow)" />

  <!-- Inner Soft Border -->
  <rect x="6" y="6" width="108" height="108" rx="30" fill="none" stroke="#86efac" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- 🛒 Modern Minimalist Grocery Cart & Produce -->
  <g transform="translate(4, 2)">
    <!-- 🍎 Red Apple / Tomato in Cart -->
    <circle cx="50" cy="46" r="11" fill="#ef4444" />
    <!-- Apple Leaf -->
    <path d="M50 35 C52 31 57 32 58 35 C58 38 53 38 50 35 Z" fill="#22c55e" />

    <!-- 🥛 Fresh Milk / Bottle -->
    <rect x="60" y="38" width="12" height="18" rx="4" fill="#ffffff" opacity="0.95" />
    <rect x="63" y="35" width="6" height="4" rx="1.5" fill="#93c5fd" />

    <!-- 🌿 Organic Farm Leaf -->
    <path d="M40 38 C32 40 33 50 44 48 C46 41 43 38 40 38 Z" fill="url(#gLeaf)" />

    <!-- Shopping Cart Frame (Smooth modern outline) -->
    <path d="M26 36 L33 36 L43 66 C44 69 47 71 50 71 L76 71 C79 71 82 69 83 66 L90 46 C90.5 44 89 42 87 42 L36 42" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Cart Basket Grid Line -->
    <path d="M40 54 L84 54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- ⚡ Lightning Speed Bolt on Cart Face -->
    <polygon points="63,48 55,59 62,59 59,68 69,56 62,56" fill="url(#gAmber)" />

    <!-- Wheels -->
    <circle cx="49" cy="80" r="5" fill="#ffffff" />
    <circle cx="75" cy="80" r="5" fill="#ffffff" />
  </g>
</svg>

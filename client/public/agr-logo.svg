<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Premium Emerald Gradient -->
    <linearGradient id="agrGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Warm Amber Accent -->
    <linearGradient id="agrAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#052e16" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Background -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#agrGreen)" filter="url(#softShadow)" />

  <!-- Grocery Shopping Bag Minimalist Silhouette -->
  <!-- Bag Body -->
  <path d="M26 38 L30 80 C30.5 83 33 85 36 85 L64 85 C67 85 69.5 83 70 80 L74 38 Z" 
        fill="#ffffff" 
        opacity="0.95" />

  <!-- Bag Handles -->
  <path d="M38 38 V28 C38 21.5 43.5 16 50 16 C56.5 16 62 21.5 62 28 V38" 
        fill="none" 
        stroke="url(#agrAmber)" 
        stroke-width="5" 
        stroke-linecap="round" />

  <!-- Fresh Organic Sprout Leaf popping out of bag -->
  <path d="M50 44 C50 32 64 26 70 30 C72 38 64 46 50 44 Z" 
        fill="#16a34a" />
  <path d="M50 44 C50 34 40 28 34 32 C32 40 38 46 50 44 Z" 
        fill="#4ade80" />

  <!-- Stylized Monogram "AGR" cut cleanly inside bag -->
  <text x="50" y="68" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
        font-size="18" 
        font-weight="900" 
        letter-spacing="1" 
        fill="#15803d" 
        text-anchor="middle">
    AGR
  </text>
</svg>
